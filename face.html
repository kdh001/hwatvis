<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>횃비스</title>
<style>
:root{color-scheme:dark;--bg:#101c32;--ink:#f0f5fc;--muted:#a8bad3;--brand:#2778cb;--sky:#9acaff;--line:#30445e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased}header{max-width:1256px;margin:auto;display:flex;justify-content:space-between;align-items:center;padding:32px 40px;color:var(--muted);font-size:13px}header b{font-size:21px;letter-spacing:-.025em;font-weight:600;color:var(--ink)}time{font-variant-numeric:tabular-nums}main{display:grid;grid-template-columns:280px minmax(0,650px);gap:75px;max-width:1100px;margin:30px auto 40px;padding:0 36px}.companion{text-align:center;padding-top:30px}.portrait{width:205px;margin:0 auto 24px;transform-origin:50% 90%}.portrait img{display:block;width:100%;height:290px;object-fit:contain}.name{font-size:24px;letter-spacing:-.025em;font-weight:500;margin-bottom:10px}#status{font-size:13px;color:var(--sky)}.listening .portrait{animation:listen 1.4s ease-in-out infinite alternate}.thinking .portrait,.working .portrait{transform:rotate(-4deg)}@keyframes listen{to{transform:translateY(-6px) rotate(2deg)}}.conversation{min-width:0;padding-top:12px}.question{width:fit-content;max-width:90%;margin:0 0 32px auto;padding:15px 22px;background:#244b75;border-radius:16px 16px 3px 16px;text-align:right}.speaker{font-size:12px;color:#bfd7ef;margin-bottom:8px}.question #heard{font-size:19px;line-height:1.5;color:var(--ink);letter-spacing:-.02em}.answer{padding-bottom:26px}.answer .speaker{color:var(--sky);margin-bottom:12px}#text{font-size:clamp(22px,2.2vw,28px);letter-spacing:-.025em;line-height:1.65;max-width:29em;word-break:keep-all;overflow-wrap:anywhere}#card{border-top:1px solid var(--line);padding-top:22px}#card:empty{display:none}#card h2{font-size:15px;font-weight:500;margin:0 0 18px;color:#ccdcf1}#card dl{margin:0;display:grid;grid-template-columns:86px minmax(0,1fr);gap:13px 22px;font-size:14px;line-height:1.6}#card dt{color:var(--muted)}#card dd{margin:0;white-space:pre-line;overflow-wrap:anywhere}button,input{font:inherit}button{border:0;border-radius:24px;background:#2778cb;color:#fff;padding:12px 22px;cursor:pointer}button:hover{background:#2669ae}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--sky);outline-offset:4px}#talk{margin-top:20px}#hint{font-size:13px;line-height:1.6;color:var(--muted)}#hint:empty{display:none}details{margin-top:24px;font-size:12px;color:var(--muted)}summary{cursor:pointer}form{display:flex;gap:8px;margin-top:14px}input{flex:1;min-width:0;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#152940;color:var(--ink)}footer{font-size:11px;line-height:1.6;color:var(--muted);margin-top:24px}::selection{background:#a5d4ff;color:#10253d}[hidden]{display:none!important}@media(max-width:760px){header{padding:24px}main{display:block;max-width:620px;padding:0 24px;margin:0 auto 32px}.companion{padding:4px 0 26px;display:grid;grid-template-columns:92px 1fr;grid-template-rows:1fr 1fr;column-gap:18px;text-align:left;align-items:center}.portrait{width:92px;grid-row:1/3;margin:0}.portrait img{height:128px}.name{font-size:21px;align-self:end;margin:0 0 6px}#status{align-self:start}.conversation{padding-top:0}.question{margin-bottom:24px}#text{font-size:23px}#card dl{gap:12px 14px;grid-template-columns:72px minmax(0,1fr)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.public-avatar{width:180px;height:240px;display:grid;place-items:center;margin:auto;font-size:84px;color:var(--sky);border:2px solid var(--line);border-radius:90px}.speaking .public-avatar{animation:listen .8s ease-in-out infinite alternate}@media(prefers-reduced-motion:reduce){.portrait,.public-avatar{animation:none!important;transform:none!important}}</style></head><body>
<header><b>횃비스</b><time id="clock"></time></header><main>
<section class="companion"><div class="portrait"><div class="public-avatar" aria-label="횃비스 상태 표시">H</div></div><div class="name">횃비스</div><div id="status" role="status">연결 중</div></section><section class="conversation"><h1 id="greeting" hidden>무엇을 도와드릴까요?</h1>
<section class="question" id="question-block" hidden><div class="speaker">내 질문</div><div id="heard"></div></section><section class="answer"><div class="speaker" id="answer-label">답변</div><div id="text" aria-live="polite">무엇을 도와드릴까요?</div></section>
<button id="talk" type="button" disabled>말하기</button><p id="hint">마이크 연결을 확인하고 있어요.</p>
<section id="card" aria-live="polite"></section>
<details><summary>글자로 대신 말하기</summary><form id="ask"><input id="q" aria-label="질문" placeholder="횃비스에게 질문하기"><button>보내기</button></form></details>
<footer id="mode"></footer></section></main>
<script>
const $=id=>document.getElementById(id),key=new URLSearchParams(location.search).get('key')||'',query='?key='+encodeURIComponent(key);
let localAudio=null,rec=null,stream=null,recording=false,busy=false,desktop=false,session=0,recordingTimer=null;
const labels={idle:'대기 중',listening:'듣고 있어요',thinking:'생각 중',working:'확인 중',speaking:'횃비스가 말하는 중'};
// 공개본은 재배포 권한이 확인되지 않은 캐릭터 이미지 대신 상태만 표시한다.
function state(s){document.body.className=s;$('status').textContent=labels[s]||s}
function question(text){$('heard').textContent=text||'';$('question-block').hidden=!text}
function clock(){$('clock').textContent=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}clock();setInterval(clock,1000);
function card(c){$('card').replaceChildren();if(!c)return;const h=document.createElement('h2');h.textContent=c.title;$('card').append(h);const dl=document.createElement('dl');for(const [label,value] of c.rows||[]){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=value;dl.append(dt,dd)}$('card').append(dl)}
const events=new EventSource('/events'+query);events.onmessage=e=>{const d=JSON.parse(e.data);if(d.input_mode){desktop=d.input_mode==='desktop';$('talk').hidden=desktop;$('talk').disabled=false;$('hint').textContent=desktop?'“횃비스”라고 부른 뒤 말씀해 주세요.':'말하기를 누르고 말씀한 뒤, 같은 버튼을 눌러 마쳐 주세요.'}if(d.demo!==undefined)$('mode').textContent=d.demo?'시연 모드 · 정보와 자료는 예시이며 실제 파일은 변경하지 않습니다.':'';if(d.showcase){$('talk').hidden=true;document.querySelector('details').hidden=true;$('hint').textContent='';$('mode').textContent='시演 모드 · 예시 데이터'.replace('演','연')}if(d.question!==undefined)question(d.question);if(d.state&&!localAudio)state(d.state);if(d.text!==undefined)$('text').textContent=d.state==='listening'?'네, 듣고 있어요.':d.text;if(d.card!==undefined)card(d.card)};events.onerror=()=>{$('status').textContent='연결이 끊겼어요. 횃비스 실행을 확인해 주세요.';$('talk').disabled=true};events.onopen=()=>{$('talk').disabled=false};
async function ask(body,ctype){if(busy)return;busy=true;const current=++session;$('talk').disabled=true;state('thinking');try{const r=await fetch('/api/talk'+query,{method:'POST',headers:{'Content-Type':ctype},body});if(!r.ok)throw Error('서버 응답 '+r.status);const d=await r.json();if(current!==session)return;question(d.heard);$('text').textContent=d.reply||'잘 듣지 못했어요. 다시 말씀해 주세요.';if(d.audio){localAudio=new Audio('data:audio/mp4;base64,'+d.audio);state('speaking');await new Promise((resolve,reject)=>{localAudio.onended=resolve;localAudio.onerror=reject;localAudio.play().catch(reject)});localAudio=null}state('idle')}catch(e){localAudio=null;state('idle');$('text').textContent='대답을 재생하지 못했어요. 다시 시도해 주세요.'}finally{busy=false;$('talk').disabled=false}}
function stopRecording(){if(rec&&rec.state==='recording')rec.stop()}
$('talk').onclick=async()=>{if(recording){stopRecording();return}try{if(!navigator.mediaDevices||!window.MediaRecorder)throw Error('unsupported');stream=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(stream);let chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{clearTimeout(recordingTimer);stream.getTracks().forEach(t=>t.stop());recording=false;$('talk').textContent='말하기';const blob=new Blob(chunks,{type:rec.mimeType});ask(blob,rec.mimeType)};rec.start();recording=true;state('listening');$('talk').textContent='말 마치기';recordingTimer=setTimeout(stopRecording,30000)}catch(e){if(stream)stream.getTracks().forEach(t=>t.stop());$('text').textContent='마이크를 사용할 수 없어요. 브라우저의 마이크 권한을 확인해 주세요.'}};
$('ask').onsubmit=e=>{e.preventDefault();const text=$('q').value.trim();if(!text||busy)return;stopRecording();$('q').value='';ask(JSON.stringify({text,audio:true}),'application/json')};
addEventListener('pagehide',()=>{clearTimeout(recordingTimer);if(stream)stream.getTracks().forEach(t=>t.stop());if(localAudio)localAudio.pause();events.close()});
</script></body></html>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
  <title id="title">횃비스 기능별 사용자 플로우</title>
  <desc id="desc">실행 후 시연 또는 일반 Claude 모드를 선택한다. 시연에서는 질문한 기능의 예시 답변과 카드를 보고, 현재 시각만 실제 Mac 시각을 읽는다. 일반 모드는 Claude와 허용 도구를 사용해 결과를 확인한다. 자동 시연은 11개 예시를 순차 재생한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#5b7087"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;fill:#172b43}
      .title{font-size:34px;font-weight:700}.subtitle{font-size:18px;fill:#536a82}.label{font-size:18px;font-weight:600}.body{font-size:19px}.small{font-size:16px;fill:#536a82}.node{fill:#fff;stroke:#bdcbd8;stroke-width:1.5}.demo{fill:#edf5fd;stroke:#91b9dc;stroke-width:1.5}.live{fill:#edf7f2;stroke:#94c4aa;stroke-width:1.5}.example{fill:#fff5e6;stroke:#d6b06d;stroke-width:1.5}.wire{fill:none;stroke:#5b7087;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="1120" fill="#f7f9fc"/>
  <text x="48" y="62" class="title">횃비스 · 사용자 사용 플로우</text>
  <text x="48" y="96" class="subtitle">사용자가 묻는 순간부터 답변을 확인할 때까지 · 현재 공개 소스 기준</text>
  <rect x="48" y="130" width="250" height="92" rx="15" class="node"/>
  <text x="173" y="168" text-anchor="middle" class="label">횃비스 실행</text>
  <text x="173" y="199" text-anchor="middle" class="small">실행 명령으로 모드 선택</text>
  <path d="M298 176H362" class="wire"/>
  <rect x="364" y="130" width="420" height="92" rx="15" class="demo"/>
  <text x="574" y="168" text-anchor="middle" class="label">시연 모드 · --demo</text>
  <text x="574" y="199" text-anchor="middle" class="small">음성 입출력은 실제 · 기능 정보는 예시</text>
  <path d="M173 130V114H1114V310" class="wire"/>
  <text x="1140" y="168" class="small">일반 모드</text>
  <text x="1140" y="194" class="small">Claude Code 인증 필요</text>
  <path d="M574 222V264" class="wire"/>
  <rect x="364" y="266" width="420" height="110" rx="15" class="node"/>
  <text x="574" y="305" text-anchor="middle" class="label">음성 또는 글자로 질문</text>
  <text x="574" y="337" text-anchor="middle" class="body">맥: “횃비스, 오늘 뭐 있어?”</text>
  <text x="574" y="363" text-anchor="middle" class="small">브라우저: 말하기 → 말 마치기 / 입력 → 보내기</text>
  <rect x="906" y="312" width="416" height="110" rx="15" class="live"/>
  <text x="1114" y="354" text-anchor="middle" class="label">자유로운 질문·작업 요청</text>
  <text x="1114" y="388" text-anchor="middle" class="body">“문서 찾아줘” · “사이트 열어줘”</text>
  <path d="M574 376V406H178V444" class="wire"/>
  <path d="M574 406H474V444" class="wire"/>
  <path d="M574 406H770V444" class="wire"/>
  <rect x="48" y="446" width="260" height="162" rx="15" class="demo"/>
  <text x="178" y="483" text-anchor="middle" class="label">생활 정보</text>
  <text x="178" y="519" text-anchor="middle" class="body">브리핑 · 교통</text>
  <text x="178" y="548" text-anchor="middle" class="body">날씨 · 학식</text>
  <text x="178" y="584" text-anchor="middle" class="small">시간표·도착·기온·식단 예시</text>
  <rect x="344" y="446" width="260" height="162" rx="15" class="demo"/>
  <text x="474" y="483" text-anchor="middle" class="label">학습</text>
  <text x="474" y="519" text-anchor="middle" class="body">자료 찾기 → 퀴즈</text>
  <text x="474" y="548" text-anchor="middle" class="body">정답·해설 · 자료 관계</text>
  <text x="474" y="584" text-anchor="middle" class="small">고정 문항 1개 · 예시 경로</text>
  <rect x="640" y="446" width="260" height="162" rx="15" class="demo"/>
  <text x="770" y="483" text-anchor="middle" class="label">자료 관리</text>
  <text x="770" y="519" text-anchor="middle" class="body">자료 정리 · iCloud</text>
  <text x="770" y="548" text-anchor="middle" class="body">메모 내용·시각 표시</text>
  <text x="770" y="584" text-anchor="middle" class="small">파일 이동·저장·동기화 없음</text>
  <path d="M1114 422V460" class="wire"/>
  <rect x="942" y="462" width="380" height="146" rx="15" class="live"/>
  <text x="1132" y="501" text-anchor="middle" class="label">Claude가 응답하거나 도구 사용</text>
  <text x="1132" y="539" text-anchor="middle" class="body">검색 · 파일 · 앱 · 화면 조작</text>
  <text x="1132" y="577" text-anchor="middle" class="small">허용 목록·OS 권한·연결 상태에 의존</text>
  <path d="M178 608V644H474V680" class="wire"/>
  <path d="M474 608V680" class="wire"/>
  <path d="M770 608V644H474" fill="none" stroke="#5b7087" stroke-width="2"/>
  <rect x="148" y="682" width="652" height="112" rx="15" class="example"/>
  <text x="474" y="724" text-anchor="middle" class="label">예시 답변을 듣고, 상세 카드를 확인</text>
  <text x="474" y="760" text-anchor="middle" class="body">실제 정보 조회·DB 저장·클라우드 변경 없음</text>
  <path d="M1132 608V680" class="wire"/>
  <rect x="942" y="682" width="380" height="112" rx="15" class="live"/>
  <text x="1132" y="724" text-anchor="middle" class="label">음성·화면에서 결과 확인</text>
  <text x="1132" y="760" text-anchor="middle" class="small">작업 성공은 실제 결과로 확인</text>
  <line x1="48" y1="840" x2="1392" y2="840" stroke="#d4dee7"/>
  <text x="48" y="885" class="label">별도 사용 흐름</text>
  <rect x="48" y="912" width="638" height="142" rx="15" class="node"/>
  <text x="76" y="950" class="label">현재 시각 · 실제 시스템 정보</text>
  <text x="76" y="987" class="body">“지금 몇 시야?” → Mac 시계 읽기 → 답변·카드</text>
  <text x="76" y="1023" class="small">상단 시계는 브라우저 기기 시각 · 메모 시각도 실제 시각</text>
  <rect x="718" y="912" width="674" height="142" rx="15" class="node"/>
  <text x="746" y="950" class="label">자동 시연 · showcase.py</text>
  <text x="746" y="987" class="body">11개 질문 순차 표시 → 예시 답변·실제 음성 → 화면 유지</text>
  <text x="746" y="1023" class="small">마이크 사용 없음 · 직접 입력 숨김 · 기능 완료의 증거 아님</text>
  <text x="48" y="1090" class="small">실제 입력·응답 동작과 예시 데이터를 구분한 현재 상태도 · 새로운 기능이나 승인 화면을 가정하지 않음</text>
</svg>

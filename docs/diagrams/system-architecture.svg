<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1230" viewBox="0 0 1560 1230" role="img" aria-labelledby="title desc">
<title id="title">횃비스 시스템 아키텍처</title><desc id="desc">브라우저와 맥 마이크의 서로 다른 입력 경로, 전사 엔진 선택, 시연 및 Claude 실행 모드, 음성 출력과 SSE 상태 전달을 보여준다. 날씨와 버스 등은 시연 데이터이며 실제 외부 정보 서비스나 DB 연결은 없다.</desc>
